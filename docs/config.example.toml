# powcon-plus — configuration example
# Copy to ~/.config/powcon-plus/config.toml (or run `powcon-plus init-config`).

# hwmon sensor: empty = auto-detect the "corsairpsu" chip.
# You can give "hwmon8" or the absolute path /sys/class/hwmon/hwmon8.
sensor = ""

# Reading rate. Below 200ms makes no sense: the PSU aggregates over ~1s.
poll_interval = "1s"

# What to show next to the icon: power | energy | both | none
label_mode = "power"

# printf formatting (float64 argument).
format_w = "%.0f W"
format_wh = "%.2f kWh"

# Tariff used for the cost estimate (in the currency picked by `currency`).
price_per_kwh = 0.25
# Currency of the cost estimate: EUR | USD | GBP | CNY | JPY
# (empty = derived from the UI language).
currency = ""

# Desktop alert when the draw stays above the threshold.
# alert_power_w = 0 disables the alert.
alert_power_w = 0
alert_sustain = "15s"
alert_cooldown = "5m"

# History: with sample_store = false the daemon writes no history file at all
# (neither the raw JSONL samples nor the daily.json rollup); the table and
# the report then show the current session only.
sample_store = true
sample_interval = "10s"   # how often to write a raw sample
retention_days = 31       # how many days of raw samples to keep

# Folder for the files (history, lock, control socket).
# Empty = ~/.local/share/powcon-plus (override: env POWCON_DATA_DIR)
data_dir = ""

# Prevents two copies of the daemon (flock on <data_dir>/lock).
single_instance = true

# Also opens the detail window when the daemon starts.
start_window = false

# Icon: "pixmap" = glyph generated by the program (works everywhere),
# "name" = freedesktop theme icon given by icon_name.
icon_mode = "pixmap"
icon_name = "powersupply"

# Language of the window, tray menu and notifications: it | en | de | fr | es | zh | ja.
# Empty = detected from the system locale (fallback: English).
# It can also be changed live from the "language" select in the window.
language = ""
