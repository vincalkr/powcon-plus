# powcon-plus — esempio di configurazione
# Copiare in ~/.config/powcon-plus/config.toml (o eseguire `powcon-plus init-config`).

# hwmon del PSU: vuoto = auto-detect del chip "corsairpsu".
# Puoi indicare "hwmon8" oppure il path assoluto /sys/class/hwmon/hwmon8.
sensor = ""

# Frequenza di lettura. Sotto 200ms non ha senso: il PSU aggrega su ~1s.
poll_interval = "1s"

# Cosa mostrare accanto all'icona: power | energy | both | none
label_mode = "power"

# Formattazione printf (argomento float64).
format_w = "%.0f W"
format_wh = "%.2f kWh"

# Tariffa per la stima del costo (valuta scelta con `currency`).
price_per_kwh = 0.25
# Valuta della stima del costo: EUR | USD | GBP | CNY | JPY
# (vuoto = scelta in base alla lingua).
currency = ""

# Avviso desktop quando l'assorbimento resta sopra la soglia.
# alert_power_w = 0 disattiva l'avviso.
alert_power_w = 0
alert_sustain = "15s"
alert_cooldown = "5m"

# Storico: con sample_store = false il daemon non scrive nessun file di
# storico (né i campioni grezzi JSONL, né il rollup giornaliero daily.json);
# tabella e report mostrano solo la sessione corrente.
sample_store = true
sample_interval = "10s"   # ogni quanto scrivere un campione grezzo
retention_days = 31       # quanti giorni di campioni grezzi conservare

# Cartella dei file (storico, lock, socket di controllo).
# Vuoto = ~/.local/share/powcon-plus (override: env POWCON_DATA_DIR)
data_dir = ""

# Evita due copie del daemon (flock su <data_dir>/lock).
single_instance = true

# Apre anche la finestra di dettaglio all'avvio del daemon.
start_window = false

# Icona: "pixmap" = glifo generato dal programma (funziona ovunque),
# "name" = icona di tema freedesktop indicata da icon_name.
icon_mode = "pixmap"
icon_name = "powersupply"

# Lingua di finestra, tray e notifiche: it | en | de | fr | es | zh | ja.
# Vuoto = rilevata dalla locale del sistema (fallback: inglese).
# Si può cambiare anche in tempo reale dalla select "Lingua" nella finestra.
language = ""
